name: Build opencv_world (CUDA, GTX 1660 / sm_75)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Java" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\LLVM" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Microsoft SQL Server" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Windows Kits\10\References" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Microsoft\VisualStudio\*" -ErrorAction SilentlyContinue
          Get-ChildItem $env:TEMP -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Disk space after cleanup:"
          Get-PSDrive -Name C,D

      - name: Clone OpenCV 5.x + opencv_contrib
        shell: pwsh
        run: |
          git clone --branch 5.x --depth 1 https://github.com/opencv/opencv.git
          git clone --branch 5.x --depth 1 https://github.com/opencv/opencv_contrib.git

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Cache CUDA installer
        id: cache-cuda
        uses: actions/cache@v4
        with:
          path: cuda_installer.exe
          key: cuda-12.4.0-network-installer

      - name: Download CUDA network installer (if not cached)
        shell: pwsh
        run: |
          if (-not (Test-Path cuda_installer.exe)) {
            Write-Host "Downloading CUDA 12.4.0 network installer..."
            curl -L -o cuda_installer.exe https://developer.download.nvidia.com/compute/cuda/12.4.0/network_installers/cuda_12.4.0_windows_network.exe
          } else {
            Write-Host "Using cached CUDA installer."
          }

      - name: Install CUDA Toolkit (full default install)
        shell: pwsh
        run: |
          Write-Host "Installing CUDA toolkit (default components)..."
          $process = Start-Process -FilePath .\cuda_installer.exe -ArgumentList "-s" -Wait -PassThru -NoNewWindow
          Write-Host "CUDA installer exit code: $($process.ExitCode)"

          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
          if (-not (Test-Path $cudaPath)) {
            Write-Error "CUDA installation failed. $cudaPath not found."
            exit 1
          } else {
            echo "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            Write-Host "CUDA installed successfully."
          }

      - name: Verify CUDA libraries exist
        shell: pwsh
        run: |
          $cudaLib = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\lib\x64"
          $required = @("cudart.lib", "nppc.lib", "nppial.lib", "nppicc.lib", "nppidei.lib", "nppif.lib", "nppig.lib", "nppim.lib")
          foreach ($lib in $required) {
            if (-not (Test-Path "$cudaLib\$lib")) {
              Write-Error "Missing CUDA library: $lib"
              exit 1
            }
          }
          Write-Host "All required CUDA libraries present."

      - name: Patch opencv_contrib (missing 'ulong' typedef on Windows)
        shell: pwsh
        run: |
          $commonHpp = "opencv_contrib/modules/cudev/include/opencv2/cudev/common.hpp"
          $patch = "#if defined(_WIN32)`ntypedef unsigned long ulong;`n#endif`n"
          $original = Get-Content $commonHpp -Raw
          Set-Content -Path $commonHpp -Value ($patch + $original) -NoNewline

      - name: Patch opencv_contrib (add longlong/ulonglong typedefs and trait specializations)
        shell: pwsh
        run: |
          $vecTraits = "opencv_contrib/modules/cudev/include/opencv2/cudev/util/vec_traits.hpp"

          $typedefPatch = @"
          #if defined(_WIN32)
          typedef long long longlong;
          typedef unsigned long long ulonglong;
          #endif
          "@
          $content = Get-Content $vecTraits -Raw
          $content = $typedefPatch + "`n" + $content

          $content = $content.Replace(
            "CV_CUDEV_MAKE_VEC_INST(ulong)",
            "CV_CUDEV_MAKE_VEC_INST(ulong)`n#if defined(_WIN32)`nCV_CUDEV_MAKE_VEC_INST(longlong)`nCV_CUDEV_MAKE_VEC_INST(ulonglong)`n#endif"
          )
          $content = $content.Replace(
            "CV_CUDEV_VEC_TRAITS_INST(ulong)",
            "CV_CUDEV_VEC_TRAITS_INST(ulong)`n#if defined(_WIN32)`nCV_CUDEV_VEC_TRAITS_INST(longlong)`nCV_CUDEV_VEC_TRAITS_INST(ulonglong)`n#endif"
          )

          Set-Content -Path $vecTraits -Value $content -NoNewline

      # Setup MSVC environment for Ninja
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure with CMake (Ninja + MSVC)
        shell: pwsh
        run: |
          mkdir opencv/build
          cd opencv/build
          cmake -G "Ninja" `
            -D CMAKE_BUILD_TYPE=Release `
            -D CMAKE_INSTALL_PREFIX="$PWD/install" `
            -D BUILD_opencv_world=ON `
            -D OPENCV_EXTRA_MODULES_PATH="$env:GITHUB_WORKSPACE/opencv_contrib/modules" `
            -D WITH_CUDA=ON `
            -D CUDA_ARCH_BIN=7.5 `
            -D CUDA_ARCH_PTX= `
            -D CUDA_FAST_MATH=ON `
            -D ENABLE_FAST_MATH=ON `
            -D WITH_CUDNN=OFF `
            -D OPENCV_DNN_CUDA=OFF `
            -D BUILD_TESTS=OFF `
            -D BUILD_PERF_TESTS=OFF `
            -D BUILD_EXAMPLES=OFF `
            -D BUILD_opencv_python3=OFF `
            -D CUDA_USE_STATIC_CUDA_RUNTIME=OFF `
            -D CUDA_RUNTIME_LIBRARY=Shared `
            -D CUDA_TOOLKIT_ROOT_DIR="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.4" `
            ..

      - name: Build and install
        shell: pwsh
        run: |
          cd opencv/build
          cmake --build . --config Release --target install --parallel

      - name: Upload opencv_world dll / lib
        uses: actions/upload-artifact@v4
        with:
          name: opencv_world-cuda-win64
          path: |
            opencv/build/install/x64/vc17/bin/opencv_world*.dll
            opencv/build/install/x64/vc17/lib/opencv_world*.lib
          if-no-files-found: error
