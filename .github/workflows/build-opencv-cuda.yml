
      # ============================================================
      # 5. Install CUDA 12.4
      # ============================================================
      - name: Install CUDA Toolkit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
          $installer = Join-Path $PWD "cuda_installer.exe"

          # ----------------------------------------------------------
          # Download CUDA 12.4 network installer
          # ----------------------------------------------------------
          if (-not (Test-Path $installer)) {

            Write-Host "Downloading CUDA 12.4 network installer..."

            curl.exe `
              -fL `
              --retry 5 `
              --retry-delay 5 `
              -o "$installer" `
              "https://developer.download.nvidia.com/compute/cuda/12.4.0/network_installers/cuda_12.4.0_windows_network.exe"

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download CUDA 12.4 installer. curl exit code: $LASTEXITCODE"
            }
          }
          else {
            Write-Host "Using cached CUDA installer."
          }

          # ----------------------------------------------------------
          # Validate installer
          # ----------------------------------------------------------
          if (-not (Test-Path $installer)) {
            throw "CUDA installer was not downloaded."
          }

          $size = (Get-Item $installer).Length

          Write-Host ""
          Write-Host "CUDA installer size: $size bytes"

          if ($size -lt 1000000) {
            throw "CUDA installer is suspiciously small."
          }

          # ----------------------------------------------------------
          # Remove incomplete CUDA installation if present
          # ----------------------------------------------------------
          if (Test-Path $cudaPath) {
            Write-Host "Existing CUDA 12.4 directory detected."

            if (Test-Path "$cudaPath\bin\nvcc.exe") {
              Write-Host "CUDA 12.4 already installed."
            }
            else {
              Write-Host "CUDA 12.4 installation appears incomplete."
              Write-Host "Removing incomplete installation..."

              Remove-Item `
                -Path $cudaPath `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

          # ----------------------------------------------------------
          # Install only the components required by OpenCV CUDA.
          #
          # These are official CUDA 12.4 Windows subpackage names.
          # ----------------------------------------------------------
          $components = @(
            "nvcc_12.4",
            "cudart_12.4",
            "cublas_12.4",
            "cublas_dev_12.4",
            "cufft_12.4",
            "cufft_dev_12.4",
            "npp_12.4",
            "npp_dev_12.4",
            "visual_studio_integration_12.4"
          )

          $arguments = @(
            "-s"
            "-n"
          ) + $components

          Write-Host ""
          Write-Host "Installing CUDA 12.4..."
          Write-Host ""
          Write-Host "Components:"
          $components | ForEach-Object {
            Write-Host "  $_"
          }

          # ----------------------------------------------------------
          # Start installer and capture exit code.
          # ----------------------------------------------------------
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host ""
          Write-Host "CUDA installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "CUDA 12.4 installer failed with exit code $($process.ExitCode)."
          }

          # ----------------------------------------------------------
          # Verify installation
          # ----------------------------------------------------------
          Write-Host ""
          Write-Host "Checking CUDA installation..."

          $nvcc = "$cudaPath\bin\nvcc.exe"
          $cudart = "$cudaPath\lib\x64\cudart.lib"
          $cublas = "$cudaPath\lib\x64\cublas.lib"
          $cufft = "$cudaPath\lib\x64\cufft.lib"

          if (-not (Test-Path $nvcc)) {
            Write-Host ""
            Write-Host "CUDA installation directory contents:"
            
            if (Test-Path $cudaPath) {
              Get-ChildItem $cudaPath -Force |
                Select-Object Name, FullName
            }
            else {
              Write-Host "CUDA directory does not exist:"
              Write-Host $cudaPath
            }

            throw "CUDA installation failed: nvcc.exe not found."
          }

          if (-not (Test-Path $cudart)) {
            throw "CUDA installation failed: cudart.lib not found."
          }

          if (-not (Test-Path $cublas)) {
            throw "CUDA installation failed: cublas.lib not found."
          }

          if (-not (Test-Path $cufft)) {
            throw "CUDA installation failed: cufft.lib not found."
          }

          # ----------------------------------------------------------
          # Export environment
          # ----------------------------------------------------------
          "CUDA_PATH=$cudaPath" |
            Out-File $env:GITHUB_ENV -Append

          "CUDA_TOOLKIT_ROOT_DIR=$cudaPath" |
            Out-File $env:GITHUB_ENV -Append

          "$cudaPath\bin" |
            Out-File $env:GITHUB_PATH -Append

          # ----------------------------------------------------------
          # Final verification
          # ----------------------------------------------------------
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "CUDA 12.4 INSTALLATION SUCCESS"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "nvcc:"
          & $nvcc --version

          Write-Host ""
          Write-Host "CUDA path:"
          Write-Host $cudaPath

          Write-Host ""
          Write-Host "cudart.lib : OK"
          Write-Host "cublas.lib : OK"
          Write-Host "cufft.lib  : OK"

          Write-Host ""
          Write-Host "=============================================="

